[package]
name = "desklink"
version = "0.1.0"
edition = "2021"
description = "Share one mouse, keyboard, clipboard and files between a Mac and a Windows PC"
license = "MIT"

[lib]
name = "desklink"
path = "src/lib.rs"

[[bin]]
name = "desklink"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["use-std"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util", "fs"] }
snow = "0.9"
spake2 = "0.4"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
hex = "0.4"
dirs = "5"
log = "0.4"
if-addrs = "0.13"
socket2 = { version = "0.6", features = ["all"] }
arboard = "3"
png = "0.17"
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "x11"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
rfd = "0.15"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSProcessInfo"] }
objc2-app-kit = { version = "0.3", features = ["NSPasteboard"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_System_Power",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
