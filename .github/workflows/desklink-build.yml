name: DeskLink 빌드 (Mac / Windows)

on:
  push:
    paths:
      - 'desklink/**'
      - '.github/workflows/desklink-build.yml'
  workflow_dispatch:
    inputs:
      release:
        description: 'GitHub Release(다운로드 페이지)도 만들기'
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: 테스트 (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desklink
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desklink
      - run: cargo test --locked

  macos:
    name: Mac 앱 (Apple 실리콘 + Intel)
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desklink
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desklink
      - name: Build
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
      - name: Make DeskLink.app and DMG
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          rm -rf dist && mkdir -p dist/stage
          APP=dist/stage/DeskLink.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          lipo -create -output "$APP/Contents/MacOS/DeskLink" \
            target/aarch64-apple-darwin/release/desklink \
            target/x86_64-apple-darwin/release/desklink
          sed "s/__VERSION__/$VERSION/g" packaging/macos/Info.plist > "$APP/Contents/Info.plist"
          ICONSET=dist/DeskLink.iconset
          mkdir -p "$ICONSET"
          for s in 16 32 128 256 512; do
            sips -z $s $s assets/icon-1024.png --out "$ICONSET/icon_${s}x${s}.png" >/dev/null
            d=$((s*2))
            sips -z $d $d assets/icon-1024.png --out "$ICONSET/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/DeskLink.icns"
          # Ad-hoc signature (no Apple developer account): required on Apple silicon.
          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose "$APP"
          lipo -info "$APP/Contents/MacOS/DeskLink"
          ln -s /Applications dist/stage/Applications
          hdiutil create -volname DeskLink -srcfolder dist/stage -ov -format UDZO "dist/DeskLink-$VERSION-mac.dmg"
          (cd dist/stage && ditto -c -k --keepParent DeskLink.app "../DeskLink-$VERSION-mac.zip")
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: DeskLink-mac
          path: |
            desklink/dist/*.dmg
            desklink/dist/*.zip
          if-no-files-found: error

  windows:
    name: Windows 앱
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desklink
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desklink
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches.Groups[1].Value
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/desklink.exe dist/DeskLink.exe
          Compress-Archive -Path dist/DeskLink.exe -DestinationPath "dist/DeskLink-$version-windows.zip" -Force
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: DeskLink-windows
          path: |
            desklink/dist/DeskLink.exe
            desklink/dist/*.zip
          if-no-files-found: error

  release:
    name: 다운로드 페이지 만들기
    if: github.event_name == 'workflow_dispatch' && inputs.release
    needs: [test, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Version
        id: v
        run: echo "version=$(grep -m1 '^version' desklink/Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: desklink-v${{ steps.v.outputs.version }}
          name: DeskLink ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            DeskLink ${{ steps.v.outputs.version }} — Mac과 Windows에서 마우스·키보드·클립보드·파일을 함께 쓰기.

            - Mac: `DeskLink-*-mac.dmg` (Apple 실리콘·Intel 모두)
            - Windows: `DeskLink-*-windows.zip` 또는 `DeskLink.exe`

            설치 방법은 저장소의 desklink/README.md를 보세요.
          files: |
            artifacts/DeskLink-mac/*
            artifacts/DeskLink-windows/*
